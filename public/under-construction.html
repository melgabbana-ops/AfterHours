<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex,nofollow">
<title>AFTER HOURS · Under Construction</title>
<style>
:root{color-scheme:dark;--gold:#c9a45c;--muted:#969087;--line:#30291e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#f4f0e8;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 25%,rgba(130,92,35,.19),transparent 45%),linear-gradient(180deg,#080706,#050505 68%);z-index:0}
main{position:relative;z-index:1;width:min(100%,520px);text-align:center;padding:34px 24px;border:1px solid #30291e;background:linear-gradient(145deg,rgba(20,17,12,.94),rgba(7,7,6,.97));box-shadow:0 25px 100px #0008}
.mark{display:block;width:min(210px,62vw);height:auto;margin:0 auto 24px;filter:drop-shadow(0 8px 24px rgba(201,164,92,.18))}
.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(39px,10vw,60px);line-height:.98;letter-spacing:.04em;margin:22px 0 8px}
h1 em{color:var(--gold);font-weight:400}
h2{font-size:10px;letter-spacing:.28em;font-weight:400;color:#b9b1a4;text-transform:uppercase;margin:20px 0 0}
p{font-size:13px;line-height:1.85;color:var(--muted);max-width:360px;margin:26px auto}
.rule{height:1px;width:66px;background:var(--gold);margin:28px auto}
.status{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);padding:11px 15px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#c7bba4}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px #c9a45c;animation:pulse 1.8s ease-in-out infinite}
footer{margin-top:34px;color:#615b51;font-size:8px;letter-spacing:.2em;text-transform:uppercase}
@keyframes pulse{50%{opacity:.35;box-shadow:0 0 3px #c9a45c}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <img class="mark" src="/after-hours-logo.svg" alt="AFTER HOURS" />
  <span class="eyebrow">AFTER HOURS · PRIVATE WORLD</span>
  <h1>UNDER<br><em>CONSTRUCTION</em></h1>
  <h2>Something worth waiting for.</h2>
  <div class="rule"></div>
  <p>We’re refining the experience behind the velvet curtain. The site is temporarily being updated. Please return soon.</p>
  <div class="status"><span class="dot" aria-hidden="true"></span> In the making · Back soon</div>
  <footer>AFTER HOURS · CINEMATIC BLACK & GOLD</footer>
</main>
</body>
</html>
