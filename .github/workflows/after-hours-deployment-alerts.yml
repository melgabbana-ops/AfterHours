name: AFTER HOURS Deployment Alerts

on:
  deployment_status:

permissions:
  contents: read
  issues: write
  deployments: read

jobs:
  report-deployment:
    if: github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error'
    runs-on: ubuntu-latest
    steps:
      - name: Create or recover deployment status alert
        uses: actions/github-script@v9
        with:
          script: |
            const state = context.payload.deployment_status.state;
            const deployment = context.payload.deployment || {};
            const environment = deployment.environment || 'unknown environment';
            const targetUrl = context.payload.deployment_status.target_url || deployment.payload?.web_url || '';
            const sha = deployment.sha || context.sha;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            if (state === 'success') {
              // Ignore out-of-order success events so an older deployment cannot
              // close an alert raised by a newer deployment in the same environment.
              const { data: latestDeployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment,
                per_page: 1
              });
              const latestDeployment = latestDeployments[0];
              if (!latestDeployment || latestDeployment.id !== deployment.id) {
                core.info('Ignoring a success event from a superseded deployment.');
                return;
              }

              const recoveredAlerts = issues.filter(issue =>
                !issue.pull_request &&
                (
                  issue.title === 'AFTER HOURS deployment failure: ' + environment ||
                  issue.title === 'AFTER HOURS deployment error: ' + environment
                )
              );
              if (recoveredAlerts.length === 0) {
                core.info('No open failure alert exists for ' + environment + '.');
                return;
              }

              const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
              for (const issue of recoveredAlerts) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    'A newer successful deployment has recovered this environment.',
                    '',
                    '- Environment: ' + environment,
                    '- Verified commit: ' + sha,
                    '- Deployment ID: ' + deployment.id,
                    targetUrl ? '- Deployment URL: ' + targetUrl : '',
                    '- Successful workflow: ' + runUrl,
                    '',
                    'Closing this stale deployment failure alert. Alerts for other environments are left unchanged.'
                  ].filter(Boolean).join('\n')
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
              return;
            }

            const title = 'AFTER HOURS deployment ' + state + ': ' + environment;
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'A deployment status update was received from the connected deployment provider.',
              '',
              '- Status: ' + state,
              '- Environment: ' + environment,
              '- Commit: ' + sha,
              '- Deployment ID: ' + (deployment.id || 'unknown'),
              targetUrl ? '- Deployment URL: ' + targetUrl : '',
              '- Event details: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions',
              '',
              'This alert reflects the GitHub deployment_status event; verify the target URL before treating it as the current production version.'
            ].filter(Boolean).join('\n');
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
