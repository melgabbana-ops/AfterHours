name: AFTER HOURS Build Watch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: after-hours-build-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  report-failure:
    name: Report failed build
    runs-on: ubuntu-latest
    needs: verify
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Open or update a build-alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'AFTER HOURS build watch: verification failed';
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'The automated AFTER HOURS test/build workflow failed.',
              '',
              '- Branch: ' + context.ref,
              '- Commit: ' + context.sha,
              '- Workflow run: ' + runUrl,
              '',
              'Review the failing step, fix the issue, and rerun the workflow. This issue is an alert; it does not mean a deployment succeeded.'
            ].join('\\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
