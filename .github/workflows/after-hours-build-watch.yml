name: AFTER HOURS Build Watch

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: after-hours-build-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  resolve-failure-alert:
    name: Resolve recovered build alert
    runs-on: ubuntu-latest
    needs: verify
    if: success() && github.event_name != 'pull_request'
    steps:
      - name: Close alert only for this recovered branch
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'AFTER HOURS build watch: verification failed';
            const branchLine = '- Branch: ' + context.ref;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue =>
              !issue.pull_request &&
              issue.title === title &&
              (issue.body || '').split(/\r?\n/).some(line => line.trim() === branchLine)
            );
            if (!existing) {
              core.info('No open build alert exists for ' + context.ref + '.');
              return;
            }
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: [
                'Build verification succeeded for this branch.',
                '',
                '- Branch: ' + context.ref,
                '- Verified commit: ' + context.sha,
                '- Successful workflow: ' + runUrl,
                '',
                'Closing this branch-specific alert. Other branch alerts are left unchanged.'
              ].join('\n')
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed'
            });

  report-failure:
    name: Report failed build
    runs-on: ubuntu-latest
    needs: verify
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Open or update a branch-specific build alert
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'AFTER HOURS build watch: verification failed';
            const branchLine = '- Branch: ' + context.ref;
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'The automated AFTER HOURS test/build workflow failed.',
              '',
              branchLine,
              '- Commit: ' + context.sha,
              '- Workflow run: ' + runUrl,
              '',
              'Review the failing step, fix the issue, and rerun the workflow. This issue is an alert; it does not mean a deployment succeeded.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue =>
              !issue.pull_request &&
              issue.title === title &&
              (issue.body || '').split(/\r?\n/).some(line => line.trim() === branchLine)
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
