name: Deploy AFTER HOURS to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate service worker syntax
        run: node --check public/sw.js
      - name: Validate brand and public visual assets
        run: npm run check:brand
      - name: Validate cinematic screen styling
        run: npm run check:cinematic
      - name: Validate mobile layout foundations
        run: npm run check:mobile
      - name: Enforce black and gold visual palette
        run: npm run check:palette
      - name: Audit visual asset resolution
        run: npm run audit:visuals
      - name: Validate database migration ledger
        run: npm run check:migrations
      - name: Run application tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
