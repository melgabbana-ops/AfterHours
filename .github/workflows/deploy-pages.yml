name: Validate AFTER HOURS GitHub Pages artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Validation only. No Pages configuration or deployment is performed here.
permissions:
  contents: read

concurrency:
  group: github-pages-validation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate service worker syntax
        run: node --check public/sw.js
      - name: Validate brand and public visual assets
        run: npm run check:brand
      - name: Validate cinematic screen styling
        run: npm run check:cinematic
      - name: Validate mobile layout foundations
        run: npm run check:mobile
      - name: Enforce black and gold visual palette
        run: npm run check:palette
      - name: Audit visual asset resolution
        run: npm run audit:visuals
      - name: Validate database migration ledger
        run: npm run check:migrations
      - name: Run application tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Upload validation artifact (not deployed)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
