name: AFTER HOURS self-healing

on:
  workflow_run:
    workflows: ["AFTER HOURS build"]
    types: [completed]
    branches: [main]

# Report-only by design. Automated repairs must never push to main.
permissions:
  contents: read

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failed main build for manual review
        run: |
          echo "AFTER HOURS main build failed."
          echo "Automatic source edits and pushes are disabled."
          echo "Review the failing workflow and prepare a reviewed pull request.";
