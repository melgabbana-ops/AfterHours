name: AFTER HOURS self-healing

on:
  workflow_run:
    workflows: ["AFTER HOURS build"]
    types: [completed]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[self-heal]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed revision
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Apply guarded repairs
        id: repair
        run: node scripts/self-heal.mjs

      - name: Verify repaired build
        if: steps.repair.outputs.changed == '1'
        run: npm run build

      - name: Commit repaired build
        if: steps.repair.outputs.changed == '1'
        run: |
          git config user.name "after-hours-self-heal"
          git config user.email "actions@users.noreply.github.com"
          git add src scripts
          git diff --cached --quiet && exit 0
          git commit -m "[self-heal] auto-repair safe build issue"
          git push origin main

      - name: Report no safe repair
        if: steps.repair.outputs.changed != '1'
        run: echo "No approved automatic repair matched this failure."
