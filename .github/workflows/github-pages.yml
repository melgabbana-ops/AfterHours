name: AFTER HOURS · GitHub Pages

on:
  push:
    branches:
      - design/reference-screen-system-nov-2026
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Supabase migration ledger
        run: npm run check:migrations

      - name: Check canonical brand assets
        run: npm run check:brand

      - name: Unit tests
        run: npm test

      - name: Build GitHub Pages bundle
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: https://yniocgfghcowjilqaock.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_rhJgE6NUK4Ejm9I9fhB_xw_xHoqKa4H
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published app shell without browser automation
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$SITE_URL" -o /tmp/after-hours-home.html; then
              break
            fi
            sleep 5
          done
          grep -q "AFTER HOURS" /tmp/after-hours-home.html
          curl --fail --silent --show-error "${SITE_URL}?enter=1" -o /tmp/after-hours-entry.html
          grep -q 'id="root"' /tmp/after-hours-entry.html
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("/tmp/after-hours-entry.html","utf8"); const paths=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(match=>match[1]); if (!paths.some(path=>path.includes(".js")) || !paths.some(path=>path.includes(".css"))) process.exit(1); console.log("Published app shell and entry route verified:", paths.join(", "));'
          while IFS= read -r path; do
            curl --fail --silent --show-error "${SITE_URL%/}$path" -o /dev/null
          done < <(grep -oE '(src|href)="[^"]+\.(js|css)"' /tmp/after-hours-entry.html | sed -E 's/^(src|href)="([^"]+)"$/\2/')
