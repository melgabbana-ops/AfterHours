name: AFTER HOURS build
# Reproducible installs and dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Sync approved PWA icon PNGs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://4c1f428b-8529-4e0b-b153-d6037b887d6e.sandbox.floot.app/_cdn/static/e24b3798-6bf4-4fc8-82fe-c13a6247d539-after-hours-icon-180.png" -o public/after-hours-icon-180.png
          curl --fail --location --retry 3 "https://4c1f428b-8529-4e0b-b153-d6037b887d6e.sandbox.floot.app/_cdn/static/56a9a061-71b6-41a5-a178-38294b18e407-after-hours-icon-192.png" -o public/after-hours-icon-192.png
          curl --fail --location --retry 3 "https://4c1f428b-8529-4e0b-b153-d6037b887d6e.sandbox.floot.app/_cdn/static/a646ee87-0631-45e2-a9e2-7d6e9fc59aaa-after-hours-icon-512.png" -o public/after-hours-icon-512.png
          test "$(stat -c%s public/after-hours-icon-180.png)" -eq 53976
          test "$(stat -c%s public/after-hours-icon-192.png)" -eq 60392
          test "$(stat -c%s public/after-hours-icon-512.png)" -eq 349602
          file public/after-hours-icon-180.png public/after-hours-icon-192.png public/after-hours-icon-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/after-hours-icon-180.png public/after-hours-icon-192.png public/after-hours-icon-512.png
          if git diff --cached --quiet; then
            echo "Uploaded icon assets already match the repository."
          else
            git commit -m "Replace AFTER HOURS PWA icon PNG assets"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Dependency security report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable}))},null,2))"
      - name: Enforce clean dependency audit
        run: npm audit --audit-level=low
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Supabase migration ledger
        run: npm run check:migrations
      - name: Check canonical brand assets
        run: npm run check:brand
      - name: Check cinematic style coverage
        run: npm run check:cinematic
      - name: Audit 4K visual assets
        run: npm run audit:visuals
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit generated lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -f package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add reproducible npm lockfile"
          git push
