name: AFTER HOURS build
# CI trigger: keep main build verification explicit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Check Supabase migration ledger
        run: npm run check:migrations
      - name: Check canonical brand assets
        run: npm run check:brand
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
