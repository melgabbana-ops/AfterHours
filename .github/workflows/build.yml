name: AFTER HOURS build
# Reproducible installs and dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dependency security report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable}))},null,2))"
      - name: Enforce clean dependency audit
        run: npm audit --audit-level=low
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Supabase migration ledger
        run: npm run check:migrations
      - name: Check canonical brand assets
        run: npm run check:brand
      - name: Check offline app-shell assets
        run: npm run check:pwa-shell
      - name: Check approved black-and-gold palette
        run: npm run check:palette
      - name: Check cinematic style coverage
        run: npm run check:cinematic
      - name: Check mobile layout foundations
        run: npm run check:mobile
      - name: Audit 4K visual assets
        run: npm run audit:visuals
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  world-invitations-sql-test:
    name: Secret Invitation · disposable PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afterhours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afterhours_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated Secret Invitation database tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afterhours_test
        run: npm run test:world-invitations-sql
