name: AFTER HOURS build
# CI trigger: keep main build verification explicit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
